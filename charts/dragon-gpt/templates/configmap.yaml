apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dragon-gpt.fullname" . }}-config
  labels:
    {{- include "dragon-gpt.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.config.env | quote }}
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
  OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  ENABLE_METRICS: {{ .Values.config.enableMetrics | quote }}
