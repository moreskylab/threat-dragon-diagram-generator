    app.kubernetes.io/component: api
data:
  ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "info"
  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_BASE_URL: ""
  ENABLE_METRICS: "true"
