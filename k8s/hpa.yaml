apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dragon-gpt-hpa
  namespace: dragon-gpt
  labels:
    app.kubernetes.io/name: dragon-gpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dragon-gpt
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
