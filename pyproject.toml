[project]
name = "threat-dragon-diagram-generator"
version = "0.1.0"
description = "Automated threat modeling using LLMs and OWASP Threat Dragon diagrams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "diagrams>=0.23.0",
    "pytm>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
dragon-gpt = "main:main"
threat-dragon-generator = "main:main"
generate-diagram = "generate:main"
dragon-gpt-server = "api.main:start"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

